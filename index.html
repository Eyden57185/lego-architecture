<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Architecture & Harry Potter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="text-center py-12">
            <h1 class="text-4xl font-extrabold text-sky-400 mb-4">LEGO Architecture & Harry Potter</h1>
            <p class="text-slate-400">Voici la collection complète des sets !</p>
        </header>

        <div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const sets = [
            { num: "21026", name: "Venise", type: "Skyline", year: "2016" },
            { num: "21027", name: "Berlin", type: "Skyline", year: "2016" },
            { num: "21028", name: "New York City", type: "Skyline", year: "2016" },
            { num: "21032", name: "Sydney", type: "Skyline", year: "2017" },
            { num: "21033", name: "Chicago", type: "Skyline", year: "2017" },
            { num: "21034", name: "Londres", type: "Skyline", year: "2017" },
            { num: "21039", name: "Shanghai", type: "Skyline", year: "2018" },
            { num: "21047", name: "Las Vegas", type: "Skyline", year: "2018" },
            { num: "21043", name: "San Francisco", type: "Skyline", year: "2019" },
            { num: "21044", name: "Paris", type: "Skyline", year: "2019" },
            { num: "21051", name: "Tokyo", type: "Skyline", year: "2020" },
            { num: "21052", name: "Dubaï", type: "Skyline", year: "2020" },
            { num: "21057", name: "Singapour", type: "Skyline", year: "2022" },
            { num: "21068", name: "Shanghai (Nouvelle version)", type: "Skyline", year: "2025" },
            { num: "10294", name: "Le Titanic", type: "Monument", year: "2021" },
            { num: "21042", name: "La Statue de la Liberté", type: "Monument", year: "2018" },
            { num: "21056", name: "Le Taj Mahal", type: "Monument", year: "2021" },
            { num: "21054", name: "La Maison Blanche", type: "Monument", year: "2020" },
            { num: "21058", name: "La Grande Pyramide de Gizeh", type: "Monument", year: "2022" },
            { num: "21061", name: "Notre-Dame de Paris", type: "Monument", year: "2024" },
            { num: "21045", name: "La Place de Trafalgar", type: "Monument", year: "2019" },
            { num: "21060", name: "Le Château de Himeji", type: "Monument", year: "2023" },
            { num: "21046", name: "L'Empire State Building", type: "Monument", year: "2019" },
            { num: "71043", name: "Le Château de Poudlard", type: "Harry Potter", year: "2018" },
            { num: "76419", name: "Le Château et le Domaine de Poudlard", type: "Harry Potter", year: "2023" },
            { num: "75978", name: "Le Chemin de Traverse", type: "Harry Potter", year: "2020" },
            { num: "76405", name: "Poudlard Express - Édition Collector", type: "Harry Potter", year: "2022" }
        ];

        const grid = document.getElementById('grid');
        sets.forEach(s => {
            grid.innerHTML += `
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
                    <span class="text-xs font-bold text-sky-400">Set ${s.num} • ${s.year}</span>
                    <h3 class="text-xl font-bold mt-1 mb-2">${s.name}</h3>
                    <span class="inline-block bg-slate-800 text-slate-300 text-xs px-3 py-1 rounded-full">${s.type}</span>
                </div>
            `;
        });
    </script>
</body>
</html>
